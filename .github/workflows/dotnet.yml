# This workflow will build a .NET project
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-net

name: .NET

on:
  push:
    branches: [ "main" ]
    tags: [ "*" ]
  pull_request:
    branches: [ "main" ]

permissions:
  contents: read
  id-token: write # enable GitHub OIDC token issuance for this job

jobs:
  build_and_publish:
    runs-on: windows-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: 10.0.x
    - name: Restore dependencies
      run: dotnet restore SQLiteLibrary.slnx
    - name: Build
      run: dotnet build --configuration Release --no-restore SQLiteLibrary.slnx
    - name: Test
      run: dotnet test --configuration Release --no-build --verbosity normal SQLiteLibrary.slnx
    - name: NuGet login (OIDC → temp API key)
      if: startsWith(github.ref, 'refs/tags/')
      uses: NuGet/login@v1
      id: login
      with:
        user: ${{secrets.NUGET_USER}}
    - name: NuGet push
      if: startsWith(github.ref, 'refs/tags/')
      run: dotnet nuget push SQLiteLibrary\bin\Release\*.nupkg --api-key ${{steps.login.outputs.NUGET_API_KEY}} --source https://api.nuget.org/v3/index.json --skip-duplicate
